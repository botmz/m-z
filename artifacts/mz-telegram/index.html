<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MZ Telegram Bots | لوحة تحكم التحويل</title>
    <meta name="description" content="لوحة تحكم خاصة لإدارة تحويل رسائل تيليجرام بين القنوات: المصادر والوجهات والتوجيه والترجمة وأسعار السوق." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem('mz-theme');
        if (t === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
